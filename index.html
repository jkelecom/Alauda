<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alauda – repetitiehulp</title>

<style>
body {
  margin: 0;
  padding: 30px 15px;
  background: #f5f1e8;
  color: #222;
  font-family: Arial, sans-serif;
}

h1 {
  margin: 0 0 30px;
  text-align: center;
  font: bold 48px Georgia, serif;
}

#library {
  max-width: 850px;
  margin: auto;
}

.piece {
  margin-bottom: 18px;
  padding: 20px;
  background: white;
  border: 1px solid #ddd5c8;
  border-radius: 12px;
}

.piece h2 {
  margin: 0 0 14px;
  font: bold 22px Georgia, serif;
}

.voice {
  display: block;
  margin: 8px 0;
}

button {
  padding: 5px 10px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #eee;
}

audio {
  display: none;
  width: 100%;
  margin-top: 8px;
}

.error {
  text-align: center;
}
</style>
</head>

<body>

<h1>Alauda</h1>
<main id="library">Repertoire laden…</main>

<script>
const USER = "jkelecom";
const REPO = "Alauda";
const BRANCH = "main";
const AUDIO_FOLDER = "audio";

const api =
  `https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

function rawUrl(path) {
  return `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/` +
    path.split("/").map(encodeURIComponent).join("/");
}

function voiceName(filename) {
  const name = filename.toLowerCase();

  if (name.includes("sop")) return "Sopraan";
  if (name.includes("alt")) return "Alt";
  if (name.includes("ten")) return "Tenor";
  if (name.includes("bas") || name.includes("bass")) return "Bas";

  return null;
}

function voiceOrder(name) {
  return {
    "Sopraan": 1,
    "Alt": 2,
    "Tenor": 3,
    "Bas": 4
  }[name] || 99;
}

function titleFromFolder(folder) {
  return folder.replace(/\s*-\s*/g, " – ");
}

function makeVoice(file) {
  const wrapper = document.createElement("div");
  wrapper.className = "voice";

  const button = document.createElement("button");
  button.textContent = "▶ " + file.voice;

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  audio.src = rawUrl(file.path);

  button.onclick = () => {
    document.querySelectorAll("audio").forEach(player => {
      if (player !== audio) {
        player.pause();
        player.style.display = "none";
      }
    });

    if (audio.style.display === "block") {
      audio.pause();
      audio.style.display = "none";
    } else {
      audio.style.display = "block";
      audio.play().catch(() => {});
    }
  };

  wrapper.append(button, audio);
  return wrapper;
}

async function loadLibrary() {
  const library = document.getElementById("library");
  const response = await fetch(api);

  if (!response.ok) {
    throw new Error(`GitHub-fout ${response.status}`);
  }

  const data = await response.json();
  const pieces = new Map();
  const prefix = AUDIO_FOLDER + "/";

  for (const item of data.tree) {
    if (item.type !== "blob" || !item.path.startsWith(prefix)) continue;
    if (!item.path.toLowerCase().endsWith(".mp3")) continue;

    const relative = item.path.slice(prefix.length);
    const slash = relative.indexOf("/");

    if (slash === -1) continue;

    const folder = relative.slice(0, slash);
    const filename = relative.slice(slash + 1);
    const voice = voiceName(filename);

    if (!voice) continue;

    if (!pieces.has(folder)) pieces.set(folder, []);
    pieces.get(folder).push({
      path: item.path,
      voice
    });
  }

  library.innerHTML = "";

  const sortedPieces = [...pieces.entries()].sort((a, b) =>
    a[0].localeCompare(b[0], "nl", { numeric: true })
  );

  for (const [folder, voices] of sortedPieces) {
    const section = document.createElement("section");
    section.className = "piece";

    const title = document.createElement("h2");
    title.textContent = titleFromFolder(folder);
    section.appendChild(title);

    voices
      .sort((a, b) => voiceOrder(a.voice) - voiceOrder(b.voice))
      .forEach(file => section.appendChild(makeVoice(file)));

    library.appendChild(section);
  }

  if (!sortedPieces.length) {
    library.textContent = "Geen MP3-bestanden gevonden.";
  }
}

loadLibrary().catch(error => {
  document.getElementById("library").innerHTML =
    `<p class="error">Repertoire kon niet worden geladen: ${error.message}</p>`;
});
</script>

</body>
</html>
