<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Alauda – repetitiehulp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --page: #f5f1e8;
  --card: #ffffff;
  --ink: #1f1f1f;
  --muted: #6c6c6c;
  --line: #ded8cc;
  --accent: #8a1f2d;
  --accent-soft: #f4e8ea;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

.site-header {
  padding: 42px 24px 28px;
  text-align: center;
}

.site-header h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2rem, 5vw, 3.3rem);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.site-header p {
  margin: 10px 0 0;
  color: var(--muted);
}

#library {
  width: min(980px, calc(100% - 28px));
  margin: 0 auto 48px;
}

.piece {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
  padding: 24px;
  margin: 18px 0;
}

.piece h2 {
  margin: 0 0 14px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.35rem;
  line-height: 1.3;
}

.voice-list {
  list-style: none;
  padding: 0;
  margin: 0 0 16px;
  display: grid;
  gap: 7px;
}

.voice-button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  padding: 3px 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-align: left;
}

.voice-button:hover,
.voice-button:focus-visible {
  color: var(--accent);
  outline: none;
}

.play-dot {
  width: 22px;
  height: 22px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
}

.play-dot svg {
  width: 10px;
  height: 10px;
  margin-left: 1px;
}

.player-wrap {
  display: none;
  margin: 8px 0 12px 30px;
}

.player-wrap.open {
  display: block;
}

audio {
  width: min(100%, 700px);
}

.resources {
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 22px;
  align-items: center;
}

.resource {
  color: var(--ink);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border-radius: 10px;
  padding: 7px 9px;
}

button.resource {
  appearance: none;
  border: 0;
  background: transparent;
  font: inherit;
  cursor: pointer;
}

.resource:hover,
.resource:focus-visible {
  background: var(--accent-soft);
  color: var(--accent);
  outline: none;
}

.resource-icon {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
}

.youtube-icon {
  width: 38px;
  height: 28px;
}

.pronunciation-player {
  display: none;
  flex-basis: 100%;
  margin-top: -4px;
}

.pronunciation-player.open {
  display: block;
}

.status {
  color: var(--muted);
  text-align: center;
  padding: 30px;
}

@media (min-width: 700px) {
  .voice-list {
    grid-template-columns: repeat(2, minmax(180px, 1fr));
  }
}

@media (max-width: 520px) {
  .piece {
    padding: 18px;
  }

  .resources {
    gap: 10px;
  }

  .resource {
    width: 100%;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <h1>Alauda</h1>
  <p>Repetitiehulp</p>
</header>

<main id="library">
  <p class="status">Bestanden laden…</p>
</main>

<script>
const GITHUB_USER = "jkelecom";
const REPO_NAME = "Alauda";
const LIBRARY_FOLDER = "audio";

const apiBase =
  `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${LIBRARY_FOLDER}`;

const ICON_PLAY = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <path fill="currentColor" d="M8 5v14l11-7z"></path>
</svg>`;

const ICON_PDF = `
<svg class="resource-icon" viewBox="0 0 48 48" aria-hidden="true">
  <path fill="#ffffff" stroke="#e00000" stroke-width="2.5"
        d="M10 3h20l8 8v34H10z"></path>
  <path fill="#f2f2f2" d="M30 3v10h10z"></path>
  <path fill="none" stroke="#e00000" stroke-width="2.2" stroke-linecap="round"
        d="M16 31c8-4 13-12 14-19m-7 5c1 10 6 17 12 18m-19 2c6-4 14-5 21-4"></path>
  <text x="24" y="43" text-anchor="middle" font-size="8" font-family="Arial"
        font-weight="700" fill="#333">PDF</text>
</svg>`;

const ICON_SPEAK = `
<svg class="resource-icon" viewBox="0 0 48 48" aria-hidden="true">
  <path fill="currentColor"
        d="M18 6c-7 0-11 5-11 12 0 5 2 8 6 11v11h10v-7h5v-6h4v-8C32 11 26 6 18 6z"></path>
  <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
        d="M34 18c3 2 3 7 0 9m4-13c6 5 6 13 0 18"></path>
</svg>`;

const ICON_YOUTUBE = `
<svg class="youtube-icon" viewBox="0 0 58 40" aria-hidden="true">
  <rect x="1" y="1" width="56" height="38" rx="10" fill="#ff0000"></rect>
  <path fill="#ffffff" d="M24 11l15 9-15 9z"></path>
</svg>`;

function displayTitle(folderName) {
  return folderName
    .replace(/\s*-\s*/g, " – ")
    .replace(/_/g, " ");
}

function stripExtension(fileName) {
  return fileName.replace(/\.[^/.]+$/, "");
}

function cleanLabel(fileName) {
  return stripExtension(fileName)
    .replace(/_/g, " ")
    .replace(/\s*-\s*/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function voiceLabel(fileName) {
  const name = cleanLabel(fileName).toLowerCase();

  if (/\b(sop|soprano|sopraan)\b/.test(name)) return "Sopraan";
  if (/\b(alt|alto)\b/.test(name)) return "Alt";
  if (/\b(ten|tenor)\b/.test(name)) return "Tenor";
  if (/\b(bas|bass)\b/.test(name)) return "Bas";

  return cleanLabel(fileName)
    .replace(/^\d+\s*/, "")
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

function isPronunciation(fileName) {
  const name = fileName.toLowerCase();
  return /(uitspraak|pronunciation|prononciation|diction|dictie)/.test(name);
}

function youtubeUrlFromText(text) {
  const match = text.match(
    /https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/[^\s]+/i
  );

  return match ? match[0] : null;
}

async function fetchJson(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`GitHub gaf foutcode ${response.status}.`);
  }

  return response.json();
}

async function fetchText(url) {
  const response = await fetch(url);

  if (!response.ok) {
    return "";
  }

  return response.text();
}

function makeVoice(file) {
  const item = document.createElement("li");

  const button = document.createElement("button");
  button.className = "voice-button";
  button.type = "button";
  button.innerHTML =
    `<span class="play-dot">${ICON_PLAY}</span>` +
    `<span>${voiceLabel(file.name)}</span>`;

  const playerWrap = document.createElement("div");
  playerWrap.className = "player-wrap";

  const player = document.createElement("audio");
  player.controls = true;
  player.preload = "none";
  player.src = file.download_url;

  button.addEventListener("click", () => {
    const wasOpen = playerWrap.classList.contains("open");

    document.querySelectorAll(".player-wrap.open").forEach(openPlayer => {
      if (openPlayer !== playerWrap) {
        openPlayer.classList.remove("open");

        const otherAudio = openPlayer.querySelector("audio");

        if (otherAudio) {
          otherAudio.pause();
        }
      }
    });

    playerWrap.classList.toggle("open", !wasOpen);

    if (!wasOpen) {
      player.play().catch(() => {});
    } else {
      player.pause();
    }
  });

  playerWrap.appendChild(player);
  item.appendChild(button);
  item.appendChild(playerWrap);

  return item;
}

function makePdfLink(file) {
  const link = document.createElement("a");

  link.className = "resource";
  link.href = file.download_url;
  link.target = "_blank";
  link.rel = "noopener";
  link.innerHTML = `${ICON_PDF}<span>partituur</span>`;

  return link;
}

function makePronunciation(file) {
  const fragment = document.createDocumentFragment();

  const button = document.createElement("button");
  button.className = "resource";
  button.type = "button";
  button.innerHTML = `${ICON_SPEAK}<span>uitspraak</span>`;

  const playerWrap = document.createElement("div");
  playerWrap.className = "pronunciation-player";

  const player = document.createElement("audio");
  player.controls = true;
  player.preload = "none";
  player.src = file.download_url;

  button.addEventListener("click", () => {
    const open = playerWrap.classList.toggle("open");

    if (open) {
      player.play().catch(() => {});
    } else {
      player.pause();
    }
  });

  playerWrap.appendChild(player);
  fragment.appendChild(button);
  fragment.appendChild(playerWrap);

  return fragment;
}function makeYoutubeLink(url) {
  const link = document.createElement("a");

  link.className = "resource";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener";
  link.innerHTML = `${ICON_YOUTUBE}<span>voorbeeld</span>`;

  return link;
}

async function loadLibrary() {

  const library = document.getElementById("library");

  const folderEntries = await fetchJson(apiBase);

  const folders = folderEntries
    .filter(entry => entry.type === "dir")
    .sort((a, b) =>
      a.name.localeCompare(b.name, "nl", { numeric: true })
    );

  library.innerHTML = "";

  for (const folder of folders) {

    const files = await fetchJson(
      `${apiBase}/${encodeURIComponent(folder.name)}`
    );

    const audioFiles = files.filter(file =>
      file.type === "file" &&
      /\.mp3$/i.test(file.name)
    );

    const pronunciation =
      audioFiles.find(file => isPronunciation(file.name));

    const voices =
      audioFiles
        .filter(file => !isPronunciation(file.name))
        .sort((a, b) => {
  const order = {
    "Sopraan": 1,
    "Alt": 2,
    "Tenor": 3,
    "Bas": 4
  };

  return (
    (order[voiceLabel(a.name)] ?? 99) -
    (order[voiceLabel(b.name)] ?? 99)
  );
});

    const pdfs =
      files.filter(file =>
        file.type === "file" &&
        /\.pdf$/i.test(file.name)
      );

    const textFiles =
      files.filter(file =>
        file.type === "file" &&
        /\.(txt|url)$/i.test(file.name)
      );

    let youtubeUrl = null;

    for (const txt of textFiles) {

      const content =
        await fetchText(txt.download_url);

      youtubeUrl =
        youtubeUrlFromText(content);

      if (youtubeUrl) {
        break;
      }

    }

    const section =
      document.createElement("section");

    section.className = "piece";

    const title =
      document.createElement("h2");

    title.textContent =
      displayTitle(folder.name);

    section.appendChild(title);

    if (voices.length) {

      const list =
        document.createElement("ul");

      list.className = "voice-list";

      voices.forEach(file => {
        list.appendChild(makeVoice(file));
      });

      section.appendChild(list);

    }

    if (
      pdfs.length ||
      pronunciation ||
      youtubeUrl
    ) {

      const resources =
        document.createElement("div");

      resources.className = "resources";

      pdfs.forEach(pdf => {
        resources.appendChild(
          makePdfLink(pdf)
        );
      });

      if (pronunciation) {
        resources.appendChild(
          makePronunciation(pronunciation)
        );
      }

      if (youtubeUrl) {
        resources.appendChild(
          makeYoutubeLink(youtubeUrl)
        );
      }

      section.appendChild(resources);

    }

    library.appendChild(section);

  }

  if (!folders.length) {

    library.innerHTML =
      '<p class="status">Geen repertoire gevonden.</p>';

  }

}

loadLibrary().catch(error => {

  console.error(error);

  document.getElementById("library").innerHTML =
    '<p class="status">De GitHub-bibliotheek kon niet worden geladen.</p>';

});
</script>

</body>
</html>
