<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Choir rehearsal aides</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Georgia, serif;
  background: #f4f1ea;
  color: #222;
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

h1 {
  text-align: center;
}

.piece {
  background: white;
  padding: 20px;
  margin: 20px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ccc;
}

audio {
  width: 100%;
}

.voice {
  margin: 12px 0;
}

.small {
  color: #666;
  font-size: 0.9em;
}

.links {
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid #ddd;
}

.resource-link {
  display: inline-block;
  margin: 6px 10px 6px 0;
  padding: 8px 12px;
  background: #f4f1ea;
  border-radius: 8px;
  text-decoration: none;
  color: #222;
  border: 1px solid #ddd;
}

.resource-link:hover {
  background: #e8e0d2;
}

.icon {
  margin-right: 6px;
}
</style>
</head>

<body>

<h1>Choir rehearsal aides</h1>
<p class="small">Select your part and press play. Scores and example performances appear underneath when available.</p>

<div id="library">Loading files…</div>

<script>
const GITHUB_USER = "jkelecom";
const REPO_NAME = "Alauda";
const BRANCH = "main";
const LIBRARY_FOLDER = "audio";

const apiBase = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${LIBRARY_FOLDER}`;

function prettyTitle(folderName) {
  return folderName
    .replace(/^\d+[-_ ]*/, "")
    .replace(/[-_]/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function prettyFileName(fileName) {
  return fileName
    .replace(/\.[^/.]+$/, "")
    .replace(/[-_]/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function prettyVoice(fileName) {
  return prettyFileName(fileName);
}

function isYouTubeLink(text) {
  return text.includes("youtube.com") || text.includes("youtu.be");
}

async function getTextFile(url) {
  const response = await fetch(url);
  return await response.text();
}

async function loadLibrary() {
  const library = document.getElementById("library");
  library.innerHTML = "";

  const folders = await fetch(apiBase).then(r => r.json());

  for (const folder of folders.filter(f => f.type === "dir")) {
    const files = await fetch(`${apiBase}/${encodeURIComponent(folder.name)}`).then(r => r.json());

    const mp3s = files.filter(f => f.name.toLowerCase().endsWith(".mp3"));
    const pdfs = files.filter(f => f.name.toLowerCase().endsWith(".pdf"));
    const linkFiles = files.filter(f =>
      f.name.toLowerCase().endsWith(".txt") ||
      f.name.toLowerCase().endsWith(".url")
    );

    const piece = document.createElement("div");
    piece.className = "piece";

    const title = document.createElement("h2");
    title.textContent = prettyTitle(folder.name);
    piece.appendChild(title);

    for (const mp3 of mp3s) {
      const voice = document.createElement("div");
      voice.className = "voice";

      const label = document.createElement("p");
      label.innerHTML = `<strong>${prettyVoice(mp3.name)}</strong>`;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = mp3.download_url;

      voice.appendChild(label);
      voice.appendChild(audio);
      piece.appendChild(voice);
    }

    if (pdfs.length > 0 || linkFiles.length > 0) {
      const links = document.createElement("div");
      links.className = "links";

      for (const pdf of pdfs) {
        const link = document.createElement("a");
        link.className = "resource-link";
        link.href = pdf.download_url;
        link.target = "_blank";
        link.innerHTML = `<span class="icon">📄</span>Score: ${prettyFileName(pdf.name)}`;
        links.appendChild(link);
      }

      for (const linkFile of linkFiles) {
        const text = await getTextFile(linkFile.download_url);
        const firstUrl = text.match(/https?:\/\/[^\s]+/);

        if (firstUrl && isYouTubeLink(firstUrl[0])) {
          const link = document.createElement("a");
          link.className = "resource-link";
          link.href = firstUrl[0];
          link.target = "_blank";
          link.innerHTML = `<span class="icon">▶️</span>Example performance`;
          links.appendChild(link);
        }
      }

      piece.appendChild(links);
    }

    library.appendChild(piece);
  }
}

loadLibrary().catch(error => {
  document.getElementById("library").innerHTML =
    "Something went wrong while loading the library. Check the GitHub username, repository name, and folder structure.";
});
</script>

</body>
</html>
